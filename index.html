<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Secret Santa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f1e6;
    --card: #fffdf8;
    --ink: #1f2a24;
    --muted: #5d6b63;
    --line: #e4dccb;
    --red: #b3262e;
    --red-ink: #ffffff;
    --green: #1f5c3f;
    --green-soft: #e3efe7;
    --warn-bg: #fff4d6;
    --warn-ink: #6b4b00;
    --chip: #f0e9da;
    --shadow: 0 1px 2px rgba(31, 42, 36, .06), 0 8px 28px rgba(31, 42, 36, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101713;
      --card: #18221c;
      --ink: #eef2ec;
      --muted: #a3b0a8;
      --line: #2b3a31;
      --red: #e0525a;
      --red-ink: #1a0a0b;
      --green: #7fcf9f;
      --green-soft: #1e3427;
      --warn-bg: #3a2f12;
      --warn-ink: #f5dc9c;
      --chip: #233028;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101713; --card: #18221c; --ink: #eef2ec; --muted: #a3b0a8; --line: #2b3a31;
    --red: #e0525a; --red-ink: #1a0a0b; --green: #7fcf9f; --green-soft: #1e3427;
    --warn-bg: #3a2f12; --warn-ink: #f5dc9c; --chip: #233028;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1, h2, .big-name {
    font-family: Fraunces, Georgia, serif;
    letter-spacing: -0.01em;
    line-height: 1.15;
    margin: 0;
  }
  h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 800; }
  h2 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  p { margin: 0; }
  .lede { color: var(--muted); margin-top: 8px; }
  header { margin-bottom: 24px; }
  .eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--red); margin-bottom: 6px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
  }
  @media (max-width: 480px) { .card { padding: 18px; } }

  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 14px; margin-bottom: 8px; font-weight: 400; }
  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  textarea { min-height: 180px; resize: vertical; line-height: 1.6; }
  textarea:focus, input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .field + .field { margin-top: 18px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
  details summary { cursor: pointer; font-weight: 600; color: var(--green); }
  details[open] summary { margin-bottom: 14px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; min-height: 8px; }
  .chip {
    background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 14px;
  }
  .chip .heart { color: var(--red); margin: 0 4px; }

  button {
    font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 10px; border: 1px solid transparent; padding: 10px 16px;
  }
  .primary { background: var(--red); color: var(--red-ink); width: 100%; padding: 14px; font-size: 17px; }
  .primary:hover { filter: brightness(1.06); }
  .secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  .secondary:hover { background: var(--chip); }
  .small { padding: 7px 12px; font-size: 14px; }
  button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .error {
    color: var(--red); font-weight: 500; margin-top: 12px; min-height: 1.5em;
  }
  .notice {
    background: var(--warn-bg); color: var(--warn-ink);
    border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px;
  }
  .ok {
    background: var(--green-soft); color: var(--ink);
    border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px;
  }

  ul.people { list-style: none; padding: 0; margin: 16px 0 0; }
  ul.people li {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  ul.people li:first-child { border-top: 0; }
  .person { flex: 1 1 140px; font-weight: 600; }
  .person .sent { color: var(--green); font-weight: 500; font-size: 13px; margin-left: 6px; }
  .actions-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  /* Reveal */
  .reveal { text-align: center; padding: 36px 24px; }
  .gift { font-size: 72px; line-height: 1; margin-bottom: 12px; display: inline-block; }
  .gift.shake { animation: shake .6s ease-in-out; }
  @keyframes shake {
    0%,100% { transform: rotate(0) } 20% { transform: rotate(-10deg) }
    40% { transform: rotate(9deg) } 60% { transform: rotate(-6deg) } 80% { transform: rotate(4deg) }
  }
  .big-name {
    font-size: clamp(36px, 10vw, 56px); font-weight: 800; color: var(--red);
    margin: 8px 0 4px; word-break: break-word;
  }
  .result { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.8) } to { opacity: 1; transform: none } }
  .details {
    display: grid; gap: 8px; margin: 24px auto 0; max-width: 360px; text-align: left;
  }
  .details div {
    background: var(--chip); border-radius: 10px; padding: 10px 14px; font-size: 15px;
  }
  .details b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .fine { color: var(--muted); font-size: 13px; margin-top: 20px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .gift.shake, .result { animation: none; }
  }

  /* Language switcher + per-person language badge */
  .topbar { display: flex; justify-content: flex-end; margin: -16px 0 12px; }
  .lang-switch {
    display: inline-flex; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); padding: 3px; gap: 2px;
  }
  .lang-switch button {
    background: transparent; color: var(--muted); border: 0; border-radius: 999px;
    padding: 4px 12px; font-size: 13px; font-weight: 600; letter-spacing: .04em;
  }
  .lang-switch button[aria-pressed="true"] { background: var(--green); color: var(--card); }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .05em;
    border: 1px solid var(--line); color: var(--muted); border-radius: 6px;
    padding: 0 5px; margin-left: 6px; vertical-align: 1px;
  }

  /* Google Sheet connection */
  .inline { display: flex; gap: 8px; }
  .inline input { flex: 1; min-width: 0; }
  .sheet-ok { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .linkish {
    background: none; border: 0; padding: 0; font-size: 14px; font-weight: 500;
    color: var(--green); text-decoration: underline; cursor: pointer;
  }
  .opened { margin-top: 12px; }
  button:disabled { opacity: .6; cursor: progress; }
</style>
</head>
<body>
<main>

  <div class="topbar">
    <div class="lang-switch" role="group" aria-label="Język / Language / Langue">
      <button type="button" data-lang="pl">PL</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
    </div>
  </div>

  <!-- ============ 1. ORGANIZER: SETUP ============ -->
  <section id="setup" hidden>
    <header>
      <div class="eyebrow" data-i18n="setupEyebrow"></div>
      <h1 data-i18n="setupTitle"></h1>
      <p class="lede" id="setupLede" data-i18n="setupLede"></p>
    </header>

    <div id="fileWarning" class="notice" data-i18n="fileWarning" hidden></div>

    <div id="sheetOk" class="ok sheet-ok" hidden>
      <span data-i18n="sheetConnected"></span>
      <button type="button" class="linkish" id="sheetDisconnect" data-i18n="sheetDisconnect"></button>
    </div>
    <form id="sheetForm" class="card" novalidate hidden>
      <label for="sheetKey" data-i18n="sheetTitle"></label>
      <p class="hint" data-i18n="sheetNeedKey"></p>
      <div class="inline">
        <input type="text" id="sheetKey" data-i18n-ph="sheetKeyPh" autocomplete="off" spellcheck="false">
        <button type="submit" class="secondary" id="sheetConnectBtn" data-i18n="sheetConnect"></button>
      </div>
      <p id="sheetError" class="error" role="alert"></p>
    </form>

    <form id="setupForm" class="card" novalidate>
      <div class="field">
        <label for="people" data-i18n="peopleLabel"></label>
        <p class="hint" data-i18n-html="peopleHint"></p>
        <textarea id="people" spellcheck="false"></textarea>
        <div id="chips" class="chips" aria-live="polite"></div>
      </div>

      <div class="field">
        <details>
          <summary data-i18n="detailsSummary"></summary>
          <div class="field">
            <label for="eventName" data-i18n="titleLabel"></label>
            <p class="hint" data-i18n="titleHint"></p>
            <input type="text" id="eventName" maxlength="80">
          </div>
          <div class="row field">
            <div>
              <label for="budget" data-i18n="budget"></label>
              <input type="text" id="budget" maxlength="40" data-i18n-ph="budgetPh">
            </div>
            <div>
              <label for="when" data-i18n="when"></label>
              <input type="text" id="when" maxlength="60" data-i18n-ph="whenPh">
            </div>
          </div>
          <div class="field">
            <label for="note" data-i18n="note"></label>
            <input type="text" id="note" maxlength="200" data-i18n-ph="notePh">
          </div>
          <p class="hint" style="margin-top:12px" data-i18n="detailsHint"></p>
        </details>
      </div>

      <div class="field">
        <button type="submit" class="primary" id="drawBtn" data-i18n="drawBtn"></button>
        <p id="setupError" class="error" role="alert"></p>
      </div>
    </form>
  </section>

  <!-- ============ 2. ORGANIZER: LINKS ============ -->
  <section id="links" hidden>
    <header>
      <div class="eyebrow" data-i18n="linksEyebrow"></div>
      <h1 data-i18n="linksTitle"></h1>
      <p class="lede" data-i18n="linksLede"></p>
    </header>

    <div class="notice" id="linksNotice" data-i18n-html="linksNotice"></div>

    <div class="card">
      <h2 id="linksTitle"></h2>
      <p class="hint" id="linksSub"></p>
      <ul class="people" id="peopleList"></ul>
      <div class="actions-bar">
        <button type="button" class="secondary small" id="copyAll" data-i18n="copyAll"></button>
        <button type="button" class="secondary small" id="startOver" data-i18n="startOver"></button>
      </div>
      <p id="copyStatus" class="hint" aria-live="polite" style="margin-top:10px"></p>
    </div>
  </section>

  <!-- ============ 3. PARTICIPANT: REVEAL ============ -->
  <section id="reveal" hidden>
    <div class="card reveal">
      <div class="eyebrow" id="revealEvent"></div>

      <div id="revealIntro">
        <div class="gift" id="gift" aria-hidden="true">🎁</div>
        <h1 id="revealHello"></h1>
        <p class="lede" id="revealCheck"></p>
        <p class="fine opened" id="openedBefore" hidden></p>
        <div style="margin-top:24px">
          <button type="button" class="primary" id="revealBtn" data-i18n="revealBtn"></button>
        </div>
      </div>

      <div id="revealResult" class="result" hidden>
        <p class="lede" style="margin-top:0" data-i18n="youAre"></p>
        <div class="big-name" id="recipient"></div>
        <p data-i18n="keepSecret"></p>
        <div class="details" id="details"></div>
        <p class="fine" data-i18n="revealFine"></p>
      </div>
    </div>
  </section>

  <section id="loading" hidden>
    <div class="card reveal">
      <div class="gift shake" aria-hidden="true">✉️</div>
      <p class="lede" data-i18n="loading"></p>
    </div>
  </section>

  <section id="problem" hidden>
    <div class="card reveal">
      <div class="gift" aria-hidden="true">🧦</div>
      <h1 id="problemTitle"></h1>
      <p class="lede" id="problemLede"></p>
      <div id="retryWrap" style="margin-top:24px" hidden>
        <button type="button" class="primary" id="retryBtn" data-i18n="retry"></button>
      </div>
    </div>
  </section>

  <footer id="footer" data-i18n="footer"></footer>
</main>

<script src="config.js"></script>

  let uiLang = DEFAULT_LANG;
  const tr = (lang, key, ...args) => {
    const v = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key];
    return typeof v === "function" ? v(...args) : v;
  };
  const t = (key, ...args) => tr(uiLang, key, ...args);

  const onLangChange = []; // re-render hooks for dynamic content
  function setLang(lang, { remember } = {}) {
    uiLang = LANGS.includes(lang) ? lang : DEFAULT_LANG;
    document.documentElement.lang = uiLang;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.lang === uiLang));
    });
    if (remember) { try { localStorage.setItem("santa-lang", uiLang); } catch (_) { /* ignore */ } }
    onLangChange.forEach((fn) => fn());
  }
  function storedLang() {
    try { return localStorage.getItem("santa-lang"); } catch (_) { return null; }
  }

  /* ------------------------------------------------------------------ *
   * Base64url helpers
   * ------------------------------------------------------------------ */
  function toB64url(bytes) {
    let s = "";
    for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function fromB64url(str) {
    const s = str.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(s + "===".slice((s.length + 3) % 4));
    return Uint8Array.from(bin, (c) => c.charCodeAt(0));
  }

  /* ------------------------------------------------------------------ *
   * Crypto: each link carries its own random AES-GCM key, IV and
   * ciphertext. The payload can't be read by glancing at the URL, and
   * a tampered link fails to decrypt instead of showing a wrong name.
   * The data sits in the URL #fragment, which browsers never send
   * to the web server.
   * ------------------------------------------------------------------ */
  async function seal(obj) {
    const keyBytes = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["encrypt"]);
    const pt = new TextEncoder().encode(JSON.stringify(obj));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, pt));
    const out = new Uint8Array(keyBytes.length + iv.length + ct.length);
    out.set(keyBytes, 0); out.set(iv, 16); out.set(ct, 28);
    return VERSION + toB64url(out);
  }
  async function unseal(token) {
    if (!token || token[0] !== VERSION) throw new Error("bad version");
    const raw = fromB64url(token.slice(1));
    if (raw.length < 29) throw new Error("too short");
    const key = await crypto.subtle.importKey("raw", raw.slice(0, 16), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(16, 28) }, key, raw.slice(28));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  /* ------------------------------------------------------------------ *
   * Sheet-backed links ("2…"): the link holds only a row id and that
   * row's key. The encrypted draw lives in the Sheet. The id is bound
   * into the encryption, so rows can't be swapped around.
   * ------------------------------------------------------------------ */
  const toHex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
  function concat(...parts) {
    const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
    let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  }
  async function sealRow(obj) {
    const idBytes = crypto.getRandomValues(new Uint8Array(16));
    const keyBytes = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["encrypt"]);
    const pt = new TextEncoder().encode(JSON.stringify(obj));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: idBytes }, key, pt));
    return {
      id: "s" + toHex(idBytes),
      data: "x" + toB64url(concat(iv, ct)),
      token: "2" + toB64url(concat(idBytes, keyBytes)),
    };
  }
  function parseSheetToken(token) {
    const raw = fromB64url(token.slice(1));
    if (raw.length !== 32) throw new Error("bad token");
    const idBytes = raw.slice(0, 16);
    return { id: "s" + toHex(idBytes), idBytes, keyBytes: raw.slice(16) };
  }
  async function openRow(data, keyBytes, idBytes) {
    if (typeof data !== "string" || data[0] !== "x") throw new Error("bad data");
    const raw = fromB64url(data.slice(1));
    const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12), additionalData: idBytes }, key, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // Apps Script web apps answer cross-origin GETs and text/plain POSTs.
  async function apiGet(params) {
    const u = new URL(API);
    Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
    const r = await fetch(u, { redirect: "follow", cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }
  async function apiPost(body) {
    const r = await fetch(API, { method: "POST", body: JSON.stringify(body), redirect: "follow" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  let memAdminKey = "";
  function adminKey() {
    try { return localStorage.getItem("santa-admin-key") || memAdminKey; } catch (_) { return memAdminKey; }
  }
  function setAdminKey(k) {
    memAdminKey = k;
    try { k ? localStorage.setItem("santa-admin-key", k) : localStorage.removeItem("santa-admin-key"); } catch (_) { /* ignore */ }
  }

  /* ------------------------------------------------------------------ *
   * Unbiased cryptographic randomness
   * ------------------------------------------------------------------ */
  function randInt(n) { // 0 <= r < n
    const max = Math.floor(0x100000000 / n) * n;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= max);
    return buf[0] % n;
  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /* ------------------------------------------------------------------ *
   * Parsing: one line = one household/couple.
   * A name may end with a language tag: "Anna (EN)" or "Anna [fr]".
   * ------------------------------------------------------------------ */
  const LANG_TAG = /^(.*?)\s*[([]\s*([A-Za-z]{2})\s*[)\]]$/;

  function parsePeople(text) {
    const groups = text
      .split(/\r?\n/)
      .map((line) => line.split(/\s*(?:&|,|\+|\/|;)\s*/)
        .map((raw) => raw.trim().replace(/\s+/g, " "))
        .filter(Boolean)
        .map((raw) => {
          const m = raw.match(LANG_TAG);
          if (m && m[1]) return { name: m[1], lang: m[2].toLowerCase(), tag: m[2] };
          return { name: raw, lang: DEFAULT_LANG };
        }))
      .filter((g) => g.length);
    const people = [];
    const groupOf = [];
    groups.forEach((g, gi) => g.forEach((p) => { people.push(p); groupOf.push(gi); }));
    return { groups, people, groupOf };
  }

  /* ------------------------------------------------------------------ *
   * The draw.
   * Rule: giver i may not get anyone from their own line (themselves or
   * their partner). Valid draws exist iff no line holds more than half
   * of everyone. Rejection sampling gives every valid draw the same
   * chance of coming up.
   * ------------------------------------------------------------------ */
  function drawNames(groupOf) {
    const n = groupOf.length;
    const sizes = {};
    groupOf.forEach((g) => { sizes[g] = (sizes[g] || 0) + 1; });
    const largest = Math.max(...Object.values(sizes));
    if (largest * 2 > n) return null;

    const idx = [...Array(n).keys()];
    for (let attempt = 0; attempt < 2_000_000; attempt++) {
      const perm = shuffle(idx.slice());
      let ok = true;
      for (let i = 0; i < n; i++) {
        if (groupOf[i] === groupOf[perm[i]]) { ok = false; break; }
      }
      if (ok) return perm; // perm[giver] = receiver
    }
    return null;
  }

  /* ------------------------------------------------------------------ *
   * Organizer UI
   * ------------------------------------------------------------------ */
  const YEAR = new Date().getFullYear();

  function renderChips() {
    const { groups } = parsePeople($("people").value);
    const chips = $("chips");
    chips.replaceChildren();
    groups.forEach((g) => {
      const c = document.createElement("span");
      c.className = "chip";
      g.forEach((p, i) => {
        if (i) {
          const h = document.createElement("span");
          h.className = "heart"; h.textContent = "♥";
          c.append(h);
        }
        c.append(document.createTextNode(p.name));
        if (p.lang !== DEFAULT_LANG) {
          const b = document.createElement("span");
          b.className = "badge";
          b.textContent = p.lang.toUpperCase();
          c.append(b);
        }
      });
      chips.append(c);
    });
  }

  let lastError = null; // [key, ...args] so it can be re-translated
  function setupError(key, ...args) {
    lastError = key ? [key, ...args] : null;
    $("setupError").textContent = key ? t(key, ...args) : "";
  }

  async function onDraw(e) {
    e.preventDefault();
    setupError(null);
    const { people, groupOf } = parsePeople($("people").value);

    if (SHEET_MODE && !adminKey()) return setupError("errNeedSheet");
    if (people.length < 3) return setupError("errMin");
    const badLang = people.find((p) => !LANGS.includes(p.lang));
    if (badLang) return setupError("errLang", badLang.tag, badLang.name);
    const lower = people.map((p) => p.name.toLowerCase());
    const dupAt = lower.findIndex((p, i) => lower.indexOf(p) !== i);
    if (dupAt !== -1) return setupError("errDup", people[dupAt].name);
    if (people.some((p) => p.name.length > 60)) return setupError("errLong");

    const perm = drawNames(groupOf);
    if (!perm) return setupError("errImpossible");

    const title = $("eventName").value.trim();
    const extras = {
      t: title,
      y: title ? "" : YEAR,
      b: $("budget").value.trim(),
      d: $("when").value.trim(),
      m: $("note").value.trim(),
    };
    const base = location.href.split("#")[0];
    const links = [];
    const rows = [];
    for (let i = 0; i < people.length; i++) {
      const payload = { g: people[i].name, r: people[perm[i]].name, l: people[i].lang, ...extras };
      Object.keys(payload).forEach((k) => payload[k] === "" && delete payload[k]);
      let url;
      if (SHEET_MODE) {
        const row = await sealRow(payload);
        url = `${base}#${row.token}`;
        rows.push({ id: row.id, name: people[i].name, lang: people[i].lang, link: url, data: row.data });
      } else {
        url = `${base}#${await seal(payload)}`;
      }
      links.push({ name: people[i].name, lang: people[i].lang, url, status: "" });
    }

    if (SHEET_MODE) {
      const btn = $("drawBtn");
      btn.disabled = true;
      btn.textContent = t("saving");
      let res = null;
      try { res = await apiPost({ action: "saveDraw", key: adminKey(), rows }); } catch (_) { /* network */ }
      btn.disabled = false;
      btn.textContent = t("drawBtn");
      if (!res || !res.ok) {
        if (res && res.error === "bad_key") { setAdminKey(""); sheetErr = "sheetBadKey"; renderSheetBox(); }
        return setupError("errSave");
      }
    }
    // `perm` and the names it points to only ever existed in local variables. From here on, all we keep is the opaque links.
    showLinks(links, title);
  }

  let current = null; // { links, title } for re-rendering on language change

  function showLinks(links, title) {
    current = { links, title };
    $("setup").hidden = true;
    $("links").hidden = false;
    renderLinks();
    if (!SHEET_MODE) window.addEventListener("beforeunload", guard); // links are saved in the Sheet otherwise
    window.scrollTo(0, 0);
  }

  function renderLinks() {
    if (!current) return;
    const { links, title } = current;
    $("linksTitle").textContent = title || t("defaultTitle", YEAR);
    $("linksSub").textContent = t("linksSub", links.length);
    const list = $("peopleList");
    list.replaceChildren();
    const canShare = typeof navigator.share === "function";

    links.forEach((link) => {
      const { name, lang, url } = link;
      const li = document.createElement("li");
      const who = document.createElement("span");
      who.className = "person";
      who.textContent = name;
      if (lang !== DEFAULT_LANG) {
        const b = document.createElement("span");
        b.className = "badge";
        b.textContent = lang.toUpperCase();
        who.append(b);
      }
      const sent = document.createElement("span");
      sent.className = "sent";
      sent.textContent = link.status ? t(link.status) : "";
      who.append(sent);

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "secondary small";
      copyBtn.textContent = t("copyLink");
      copyBtn.addEventListener("click", async () => {
        if (await copyText(url)) {
          link.status = "copied";
          sent.textContent = t("copied");
          flash("copiedFlash", name);
        }
      });
      li.append(who, copyBtn);

      if (canShare) {
        const shareBtn = document.createElement("button");
        shareBtn.type = "button";
        shareBtn.className = "secondary small";
        shareBtn.textContent = t("share");
        shareBtn.addEventListener("click", async () => {
          try {
            // The message is in the recipient's language, not the organizer's.
            await navigator.share({
              title: title || tr(lang, "defaultTitle", YEAR),
              text: tr(lang, "shareText", name),
              url,
            });
            link.status = "shared";
            sent.textContent = t("shared");
          } catch (_) { /* cancelled */ }
        });
        li.append(shareBtn);
      }
      list.append(li);
    });
  }

  function initLinksButtons() {
    $("copyAll").addEventListener("click", async () => {
      if (!current) return;
      const text = current.links.map((l) => `${l.name}: ${l.url}`).join("\n\n");
      if (await copyText(text)) flash("copyAllFlash");
    });
    $("startOver").addEventListener("click", () => {
      if (confirm(t(SHEET_MODE ? "confirmStartOverSheet" : "confirmStartOver"))) {
        current = null;
        $("links").hidden = true;
        $("setup").hidden = false;
        window.removeEventListener("beforeunload", guard);
      }
    });
  }
  function guard(e) { e.preventDefault(); e.returnValue = ""; }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (_) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.append(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      if (!ok) prompt(t("copyPrompt"), text);
      return true;
    }
  }
  let flashTimer;
  let lastFlash = null;
  function flash(key, ...args) {
    lastFlash = [key, ...args];
    $("copyStatus").textContent = t(key, ...args);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { lastFlash = null; $("copyStatus").textContent = ""; }, 6000);
  }

  /* ------------------------------------------------------------------ *
   * Organizer: Google Sheet connection
   * ------------------------------------------------------------------ */
  let sheetErr = null;
  function renderSheetBox() {
    if (!SHEET_MODE) return;
    const connected = Boolean(adminKey());
    $("sheetOk").hidden = !connected;
    $("sheetForm").hidden = connected;
    $("sheetError").textContent = sheetErr ? t(sheetErr) : "";
  }
  function initSheetBox() {
    $("sheetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      // Accept the whole log line ("Secret Santa admin key: 3f9a…") or just the key.
      const raw = $("sheetKey").value;
      const hex = raw.match(/[0-9a-f]{64}/i);
      const key = (hex ? hex[0] : raw).trim();
      if (!key) return;
      sheetErr = null;
      $("sheetConnectBtn").disabled = true;
      let res = null;
      try { res = await apiPost({ action: "ping", key }); } catch (_) { sheetErr = "sheetOffline"; }
      $("sheetConnectBtn").disabled = false;
      if (res && res.ok) { setAdminKey(key); $("sheetKey").value = ""; }
      else if (res) sheetErr = "sheetBadKey";
      renderSheetBox();
    });
    $("sheetDisconnect").addEventListener("click", () => { setAdminKey(""); renderSheetBox(); });
    renderSheetBox();
  }

  /* ------------------------------------------------------------------ *
   * Participant UI
   * ------------------------------------------------------------------ */
  let revealData = null;
  let problem = null; // "broken" | "gone" | "net"

  function renderReveal() {
    if (!revealData) return;
    const data = revealData;
    const title = data.t || t("defaultTitle", data.y || YEAR);
    document.title = title;
    $("revealEvent").textContent = title;
    $("revealHello").textContent = t("hello", data.g);
    $("revealCheck").textContent = t("check", data.g);
    $("recipient").textContent = data.r;
    const det = $("details");
    det.replaceChildren();
    [["budget", data.b], ["when", data.d], ["note", data.m]].forEach(([k, v]) => {
      if (!v) return;
      const d = document.createElement("div");
      const b = document.createElement("b");
      b.textContent = t(k);
      d.append(b, document.createTextNode(v));
      det.append(d);
    });
    const opened = $("openedBefore");
    if (data.opens > 0) {
      let when = "";
      try {
        if (data.first) when = new Intl.DateTimeFormat(uiLang, { dateStyle: "medium", timeStyle: "short" }).format(new Date(data.first));
      } catch (_) { /* ignore */ }
      opened.textContent = t("openedBefore", data.opens, when);
      opened.hidden = false;
    } else {
      opened.hidden = true;
    }
  }

  function renderProblem() {
    if (!problem) return;
    $("problemTitle").textContent = t(problem + "Title");
    $("problemLede").textContent = t(problem + "Lede");
    $("retryWrap").hidden = problem !== "net";
  }
  function showProblem(kind) {
    problem = kind;
    $("loading").hidden = true;
    $("problem").hidden = false;
    renderProblem();
  }

  async function loadReveal(token) {
    let data;
    if (token[0] === VERSION) {
      // Self-contained link: the whole encrypted draw is in the link.
      try { data = await unseal(token); } catch (_) { return showProblem("broken"); }
    } else if (token[0] === "2" && SHEET_MODE) {
      // Sheet-backed link: fetch this row's encrypted draw, unlock it here.
      let parsed;
      try { parsed = parseSheetToken(token); } catch (_) { return showProblem("broken"); }
      $("loading").hidden = false;
      let res;
      try { res = await apiGet({ action: "open", id: parsed.id }); } catch (_) { return showProblem("net"); }
      if (!res || !res.ok) return showProblem(res && res.error === "not_found" ? "gone" : "net");
      try { data = await openRow(res.data, parsed.keyBytes, parsed.idBytes); } catch (_) { return showProblem("broken"); }
      data.opens = Number(res.opens) || 0;
      data.first = res.first || null;
      $("loading").hidden = true;
    } else {
      return showProblem("broken");
    }

    revealData = data;
    // The person's language comes from their link (chosen by the organizer).
    // They can still switch with the PL/EN/FR buttons; that isn't remembered.
    setLang(data.l || DEFAULT_LANG);
    $("reveal").hidden = false;
  }

  function initReveal(token) {
    $("revealBtn").addEventListener("click", () => {
      $("gift").classList.add("shake");
      const done = () => {
        $("revealIntro").hidden = true;
        $("revealResult").hidden = false;
      };
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) done();
      else setTimeout(done, 650);
    }, { once: true });
    $("retryBtn").addEventListener("click", () => {
      problem = null;
      $("problem").hidden = true;
      loadReveal(token);
    });
  }

  /* ------------------------------------------------------------------ *
   * Router
   * ------------------------------------------------------------------ */
  const token = location.hash.slice(1);
  const isReveal = Boolean(token);
  if (SHEET_MODE) {
    $("footer").dataset.i18n = "footerSheet";
    $("setupLede").dataset.i18n = "setupLedeSheet";
  }

  onLangChange.push(() => {
    if (isReveal) { renderReveal(); renderProblem(); return; }
    $("people").placeholder = t("peoplePh");
    $("eventName").placeholder = t("defaultTitle", YEAR);
    if (lastError) $("setupError").textContent = t(...lastError);
    if (lastFlash) $("copyStatus").textContent = t(...lastFlash);
    renderSheetBox();
    renderLinks();
  });

  document.querySelectorAll(".lang-switch button").forEach((b) => {
    b.addEventListener("click", () => setLang(b.dataset.lang, { remember: !isReveal }));
  });

  if (isReveal) {
    setLang(DEFAULT_LANG); // until the link is decoded
    initReveal(token);
    loadReveal(token);
  } else {
    if (SHEET_MODE) $("linksNotice").dataset.i18nHtml = "linksNoticeSheet";
    setLang(storedLang() || DEFAULT_LANG);
    $("setup").hidden = false;
    if (location.protocol === "file:") $("fileWarning").hidden = false;
    $("people").addEventListener("input", renderChips);
    $("setupForm").addEventListener("submit", onDraw);
    initLinksButtons();
    if (SHEET_MODE) initSheetBox();
    renderChips();
  }
  window.addEventListener("hashchange", () => location.reload());
})();
</script>
</body>
</html>
